services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: zdocs
      POSTGRES_PASSWORD: zdocs
      POSTGRES_DB: zdocs
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zdocs"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
