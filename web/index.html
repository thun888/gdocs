<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#FFFFFF" />
  <title>gdocs</title>
  <link rel="icon" href="/favicon.ico" />
  <link rel="stylesheet" href="/css/open-sans.css" />
  <link rel="stylesheet" href="/css/font-awesome.min.css" />
  <link rel="stylesheet" href="/css/atom-one-light.css" />
  <link rel="stylesheet" href="/css/atom-one-dark.css" />
</head>
<body>
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('gdocs-theme');
        var hour = new Date().getHours();
        var dark = saved ? saved === 'dark' : (hour >= 21 || hour < 6);
        if (dark) document.body.classList.add('theme-dark');
        var scale = localStorage.getItem('gdocs-font-scale');
        if (scale) document.documentElement.style.setProperty('--font-scale', scale);
      } catch (e) {}
    })();
  </script>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
